# Деплой на Render (бесплатный план): New → Blueprint → этот репозиторий. Ключи вводятся в панели Render, не в git.
# Данные 2GIS (в git их нет): Environment → Secret Files → загрузить два файла из data/:
#   dgis_pois.json  — слой популярных мест 2GIS;
#   dgis_cache.json — уже собранные часы/рейтинги кандидатов (иначе демо-ключ быстро упрётся в дневной лимит).
# Геолокация и микрофон в браузере работают только по https — Render даёт https сам.
services:
  - type: web
    name: okno-astana
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DGIS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
