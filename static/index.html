<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Окно</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#090d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Окно">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="description" content="Окно — помощник по свободному времени в Астане: 1–3 реальных места по пути, открытых, когда ты дойдёшь, и так, чтобы ты точно успел.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234cc9f0%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 font-family=%22Arial%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%2308111a%22%3EО%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#090d12; --glass:rgba(14,19,26,.86); --glass2:rgba(20,27,36,.92);
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eef3f8; --muted:#97a3b2; --dim:#627083;
  --accent:#4cc9f0; --accent2:#8b6cff; --ok:#3ddc97; --warn:#f6b73c; --cold:#a8d8ff; --taxi:#c7cfd9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.5)}

/* ---------- верх: поиск ---------- */
.top{position:fixed;left:16px;top:16px;width:min(540px,calc(100vw - 32px));z-index:6;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:10px;border-radius:18px;padding:6px 6px 6px 8px}
.logo{flex:none;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#08111a}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:15.5px;padding:9px 0}
.search input::placeholder{color:var(--dim)}
.go{flex:none;height:40px;padding:0 16px;border-radius:13px;border:0;background:var(--accent);color:#08111a;font-weight:800;font-size:14px;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.mic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#252c36;color:#aeb6c1;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.mic:hover{color:#fff;background:#2e3743}
.mic svg{width:19px;height:19px}
#cam.busy svg{animation:spin 1s linear infinite}
@media (max-width:640px){.search .mic{width:36px;height:36px}}
.mic.on{background:#e5484d;border-color:#e5484d;color:#fff;animation:micp 1.3s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}50%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:1px}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.pill:hover{color:var(--text)}
.pill.on{color:var(--text);background:rgba(40,52,66,.92)}
.pill.cold.on{color:var(--cold);background:rgba(40,70,100,.9)}
.pill input{background:none;border:0;color:inherit;font:inherit;width:0;outline:none;color-scheme:dark;padding:0}
.pill .x{opacity:.6;margin-left:2px}
.langs{position:fixed;right:52px;top:9px;z-index:6;display:flex;padding:3px;gap:2px;border-radius:999px}
.langs button{background:none;border:0;color:var(--muted);font-weight:800;font-size:11.5px;padding:4px 7px;border-radius:999px;cursor:pointer}
.langs button.on{background:rgba(76,201,240,.18);color:var(--accent)}
.pill svg{width:15px;height:15px;flex:none}
#locbtn svg{width:20px;height:20px}
.ico{color:#c9bcff}.mk{color:#c9bcff}
.card .leg svg{flex:none}
.ex button{display:flex;gap:10px;align-items:flex-start}
.ex .qi{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(76,201,240,.12);color:var(--accent)}

/* сводка под поиском */
.sum{border-radius:18px;padding:12px 14px;display:none;animation:pop .35s ease both}
.sum.show{display:block}
.sum .l1{display:flex;align-items:baseline;gap:9px}
.sum .l1 b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .l1 span{color:var(--muted);font-size:13px}
.sum .l1 .buf{margin-left:auto;font-weight:800;color:var(--ok)}.sum .l1 .buf.warn{color:var(--warn)}
.sum .hl{font-size:14px;font-weight:600;color:#d5dce5;margin:3px 0 9px;line-height:1.35}
.track{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}
.track div{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.t-walk{background:var(--accent)}.t-walk.cold{background:var(--cold)}
.t-taxi{background:#7e8794}.t-stop{background:var(--accent2)}
.t-buffer{background:repeating-linear-gradient(135deg,rgba(61,220,151,.5) 0 4px,rgba(61,220,151,.18) 4px 8px)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.note{margin-top:9px;font-size:12.5px;line-height:1.4;color:#dcd6ff;display:flex;gap:7px}
.note .lb{margin-left:auto;flex:none;border:1px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:800;border-radius:9px;padding:4px 9px;cursor:pointer;align-self:center}
.note:before{content:"!";flex:none;width:17px;height:17px;border-radius:50%;background:rgba(139,108,255,.3);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.links a,.links button{font-size:12.5px;font-weight:700;text-decoration:none;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);cursor:pointer}
.links .primary{background:var(--accent);color:#08111a;border-color:var(--accent)}
.links .ghost svg{display:none}
.links .ghost{background:none;border-color:transparent;color:var(--muted);margin-left:auto}
.err{font-size:14px;line-height:1.5}
.err .tip{color:var(--muted);font-size:13px;margin-top:6px}
.steps{display:flex;flex-direction:column;gap:4px}
.steps .s{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--dim)}
.steps .s i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);flex:none}
.steps .s.run{color:var(--text)}.steps .s.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps .s.wake{color:var(--warn)}
.steps .s.done{color:var(--muted)}.steps .s.done i{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- низ: карточки ---------- */
.deck{position:fixed;left:0;right:0;bottom:16px;z-index:5;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{flex:none;width:300px;scroll-snap-align:start;border-radius:20px;padding:13px 14px;cursor:pointer;animation:pop .45s ease both;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--accent2)}
.card .leg{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.card .leg .est.jam{color:#ffb86b;background:rgba(255,160,80,.12)}
.card .leg .est{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--card);color:var(--dim)}
.ch{display:flex;gap:10px;align-items:center}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:rgba(139,108,255,.16);position:relative}
.ico i{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10.5px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid #121821}
.ch h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch .sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.swap{margin-left:auto;flex:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--muted);cursor:pointer;font-size:15px}
.swap:hover{color:var(--text)}
.ph{height:124px;margin:-13px -14px 11px;border-radius:19px 19px 0 0;background:#1b2330 center/cover no-repeat;position:relative}
.ph small{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:#fff;opacity:.75;text-shadow:0 0 3px #000}
.pc .ph{height:130px;margin:-12px -14px 10px;border-radius:15px 15px 0 0}
.wc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:7px;padding:2px 8px 2px 6px;border-radius:7px}
.wc svg{width:13px;height:13px}.wc.yes{color:#3ddc97;background:rgba(61,220,151,.12)}.wc.limited{color:#ffd166;background:rgba(255,209,102,.12)}.wc.no{color:#ff7b7b;background:rgba(255,90,90,.12)}
.ct{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ct a{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text);text-decoration:none;padding:5px 9px;border-radius:9px;background:var(--card);border:1px solid var(--line)}
.ct a svg{width:13px;height:13px;color:var(--accent)}
.card.evc{border-color:rgba(255,184,107,.45)}
.card.evc .leg{color:#ffb86b}
.ico.evi{background:rgba(255,184,107,.16);color:#ffb86b}
.why{font-size:13.5px;line-height:1.42;margin-top:9px;color:#e3e8ee}
.todo{font-size:12.8px;line-height:1.42;margin-top:5px;color:var(--muted)}
.open{font-size:12px;font-weight:700;margin-top:auto;padding-top:9px}
.open.ok{color:var(--ok)}.open.est{color:var(--warn)}.open.out{color:var(--cold)}
.rt{color:#ffd166;font-weight:700}
.src{font-size:10.5px;color:var(--dim);margin-top:4px}.src a{color:var(--dim)}
.card.fin{width:236px;justify-content:center}
.card .leg{white-space:nowrap}
.card.fin .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

/* старт: примеры */
.ex{display:none;position:fixed;left:16px;bottom:16px;z-index:5;width:min(540px,calc(100vw - 32px));border-radius:20px;padding:14px}
.ex.show{display:block}
.ex h4{margin:0 0 4px;font-size:15px}
.ex p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
#exBtn.hint{animation:hintp 1.6s ease-in-out 3;color:var(--text)}
@keyframes hintp{50%{box-shadow:0 0 0 6px rgba(76,201,240,.25);border-color:var(--accent)}}
.ex .near{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ex .near button{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(76,201,240,.12);border:1px solid rgba(76,201,240,.35);color:var(--text);cursor:pointer}
.ex .near button svg{color:var(--accent)}
.ex .near small{display:block;width:100%;color:var(--dim);font-size:11.5px;margin-bottom:2px}
.ex .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ex button{text-align:left;font-size:13px;padding:10px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;line-height:1.3}
.ex button:hover{border-color:var(--line2)}
.ex button small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}

/* первый визит: что это и как пользоваться */
.intro{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;background:rgba(4,7,11,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.intro.show{display:grid}
.intro .box{width:min(440px,100%);border-radius:22px;padding:20px 20px 16px;animation:pop .35s ease both;max-height:calc(100dvh - 32px);overflow:auto}
.intro .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.intro h3{margin:0;font-size:19px;line-height:1.2}
.intro .lead{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.45}
.intro ol{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:9px}
.intro li{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.intro li .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(76,201,240,.12);color:var(--accent)}
.intro li b{display:block;font-size:14px;margin-bottom:1px}
.intro li span{color:var(--muted)}
.intro .priv{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--dim);line-height:1.4;padding:10px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.intro .priv svg{flex:none;color:var(--ok);margin-top:1px}
.intro .act{display:flex;gap:8px}
.intro .act button{flex:1;height:42px;border-radius:13px;font-weight:800;font-size:14px;cursor:pointer}
.intro .try{border:0;background:var(--accent);color:#08111a}
.intro .ok{background:var(--card);border:1px solid var(--line2)}
.langs #helpBtn{color:var(--muted);min-width:24px}
.evpop .maplibregl-popup-content{background:var(--glass2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font:13px/1.4 Manrope,system-ui,sans-serif}
.evpop .maplibregl-popup-content b{display:block;font-size:14px;margin-bottom:3px}
.evpop .maplibregl-popup-content .v{color:var(--muted);margin:2px 0 6px}
.evpop .maplibregl-popup-content a{color:var(--accent);font-weight:700}
.evpop .maplibregl-popup-close-button{color:var(--muted);font-size:18px}
.evpop .maplibregl-popup-tip{border-top-color:var(--glass2);border-bottom-color:var(--glass2)}
#qr .qrimg{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center;margin:4px auto 12px;width:max-content}
#qr .lnk{font-size:11.5px;color:var(--dim);word-break:break-all;text-align:center;margin-bottom:12px}

/* «как посчитано» */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.sheet.show{display:flex}
.sheet .box{width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:22px;padding:18px 20px;background:var(--glass2)}
.sheet h4{margin:0 0 10px;font-size:17px}
.sheet ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.55}
.sheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.sheet .kv div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--muted)}
.sheet .kv b{display:block;color:var(--text);font-size:15px}
.rag{display:flex;align-items:stretch;gap:4px;margin:0 0 16px}
.rag .st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rag .st i{color:var(--accent);font-style:normal}
.rag .st b{font-size:12.5px;line-height:1.25}
.rag .st small{font-size:10.5px;color:var(--dim)}
.rag .ar{align-self:center;color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chips span{font-size:11.5px;padding:4px 8px;border-radius:8px;background:var(--card);color:var(--muted)}
.chips b{color:var(--text)}
.chips .eg{display:block;font-style:normal;color:var(--dim);font-size:11px;margin-top:2px}

/* карта */
.mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#1b2330;border:2.5px solid var(--accent2);box-shadow:0 6px 18px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s;position:relative}
.mk:hover,.mk.sel{transform:scale(1.18)}
.mk i{position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center}
.mk.a{background:#fff;border-color:#fff;color:#08111a;font-weight:800;font-size:13px;width:28px;height:28px}
.mk.b{background:var(--ok);border-color:var(--ok);color:#08111a;font-weight:800;font-size:13px;width:28px;height:28px}
.mk.f{background:var(--accent2);border-color:var(--accent2);color:#fff;width:30px;height:30px}
.mk.bm{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:max-content;height:auto;border:0;border-radius:0;background:none;box-shadow:none;transform:none}
.bm .pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b1118;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.55);transition:transform .15s;animation:glow 2.6s ease-in-out infinite}
.bm .pin svg{width:15px;height:15px}
.mk.bm:hover{transform:none}.bm:hover .pin{transform:scale(1.15)}
.bm span{font-size:11px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;max-width:120px;overflow:hidden;text-overflow:ellipsis}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent),0 4px 12px rgba(0,0,0,.55)}50%{box-shadow:0 0 0 8px transparent,0 4px 12px rgba(0,0,0,.55)}}
.pill.sv svg{color:var(--c)}
.savepop{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease both}
.savepop .nm{display:flex;gap:8px}
.savepop input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:8px 10px;outline:none}
.savepop input:focus{border-color:var(--accent)}
.savepop .ok{border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:#08111a;font-weight:800;cursor:pointer}
.savepop .kinds{display:flex;flex-wrap:wrap;gap:6px}
.savepop .kinds button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.savepop .kinds button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b1118}
.savepop .kinds button i svg{width:13px;height:13px}
.savepop .kinds button.on{border-color:var(--c);color:var(--text)}
.savepop small{color:var(--dim);font-size:11.5px}
.pill.sv.new{animation:flash 1.2s ease 2}
@keyframes flash{50%{background:rgba(255,209,102,.35);color:#fff}}
.mk.pick{width:auto;height:auto;border:0;background:none;box-shadow:none;color:#fff;filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}
.mk.pick svg{width:32px;height:32px;fill:#e5484d}

let LANG = "ru";
try { LANG = localStorage.getItem("okno_lang") || ({en:"en", kk:"kk"}[(navigator.language||"ru").slice(0,2)] || "ru"); } catch(e) {}
const T = k => (I18N[LANG] && I18N[LANG][k] !== undefined ? I18N[LANG][k] : I18N.ru[k]);
const TH = s => (T("hours")||[]).reduce((a,[ru,x]) => a.split(ru).join(x), String(s ?? ""));
const DN = x => (LANG === "en" && x.name_en) || (LANG === "kk" && x.name_kk) || x.name;   // название на языке интерфейса
const TC = c => c;   // категории пока по-русски на всех языках
// телефон и сайт места (из OpenStreetMap) — нажал и звонишь / открываешь
const contactsHtml = x => (x && (x.phone || x.website)) ? `<div class="ct">${x.phone ? `<a href="tel:${esc(x.phone.replace(/[^+\d]/g,""))}" onclick="event.stopPropagation()">${svg("Phone",13)}${esc(x.phone)}</a>` : ""}${x.website ? `<a href="${esc(/^https?:/.test(x.website) ? x.website : "https://" + x.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${svg(/instagram/.test(x.website) ? "AtSign" : "Globe",13)}${/instagram/.test(x.website) ? "Instagram" : T("site")}</a>` : ""}</div>` : "";
function applyLang(){
  try { const c = (CAM[LANG] || CAM.ru).t; $("#cam").title = c; $("#cam").setAttribute("aria-label", c); } catch(e) {}
  try { if(map.getLayer("lrt-name")) map.setLayoutProperty("lrt-name", "text-field",
    ["concat","LRT · ",["get", LANG === "en" ? "en" : LANG === "kk" ? "kk" : "ru"]]); } catch(e) {}
  document.documentElement.lang = LANG;
  $("#go").textContent = T("find"); $("#q").placeholder = T("ph");
  if(typeof renderMe === "function") renderMe();
  $("#tnow").textContent = T("now"); if(typeof showNow === "function") showNow();
  $("#exT").textContent = T("heroT"); $("#exP").textContent = T("heroP"); $("#exL").textContent = T("examples");
  $("#mic").title = T("micT"); $("#mic").setAttribute("aria-label", T("micT"));
  renderNear();
  $("#quick").innerHTML = QUICK.map((q,i)=>`<button data-i="${i}"><span class="qi">${svg(q[0],16)}</span><span>${T("quick")[i][0]}<small>${T("quick")[i][1]}</small></span></button>`).join("");
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  wxLabel();
  renderSaved();
  if(state.last && !state.last.error) render(state.last);
}
function setLang(l){ LANG = l; try { localStorage.setItem("okno_lang", l); } catch(e) {} applyLang(); }

function renderNear(){
  const box = $("#nearMe"); if(!box) return;
  box.innerHTML = (typeof me !== "undefined" && me) ? `<div class="near"><small>${T("nearT")}</small>${NEAR.map(([ic, k]) =>

// здание под точкой (из векторных тайлов OpenStreetMap) — чтобы закладка «села» на дом, как в 2GIS
function buildingAt(ll){
  if(!ll || !map.getLayer("b3d")) return null;
  const f = map.queryRenderedFeatures(map.project(ll), {layers:["b3d"]})[0];
  if(!f || !/Polygon/.test(f.geometry.type)) return null;
  const r5 = a => Array.isArray(a[0]) ? a.map(r5) : [+a[0].toFixed(6), +a[1].toFixed(6)];
  // в тайлах несколько домов могут быть одним объектом (MultiPolygon) — берём только тот, внутри которого точка
  const inside = (pt, ring) => { let c = false; for(let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if(((yi > pt[1]) !== (yj > pt[1])) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; } return c; };
  let poly = f.geometry.type === "Polygon" ? f.geometry.coordinates : null;
  if(!poly){
    const P = [ll.lng, ll.lat];
    poly = f.geometry.coordinates.find(pg => inside(P, pg[0]));
    if(!poly) return null;
  }
  const g = {type:"Polygon", coordinates:r5(poly)};
  const ring = g.coordinates[0];
  const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]);
  return {g, h:f.properties.render_height || 10, center:[(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2]};
}

// ---------- снег/дождь на фоне — по реальной погоде (или в симуляции −25°) ----------
const fx = $("#fx"), fxc = fx.getContext("2d");
let fxKind = null, parts = [];
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function setFx(kind){ fxKind = calm ? null : kind; parts = []; }
function fxLoop(){
  requestAnimationFrame(fxLoop);
  if(fx.width !== innerWidth || fx.height !== innerHeight){ fx.width = innerWidth; fx.height = innerHeight; }
  fxc.clearRect(0, 0, fx.width, fx.height);
  if(!fxKind) return;
  const N = fxKind==="snow" ? 130 : 150;
  while(parts.length < N) parts.push({x:Math.random()*fx.width, y:Math.random()*fx.height - (parts.length>=N/2?fx.height:0),
    r:1.2+Math.random()*2.2, v:fxKind==="snow" ? .4+Math.random()*.9 : 8+Math.random()*5, ph:Math.random()*6.28});
  for(const p of parts){
    if(fxKind==="snow"){
      p.y += p.v; p.ph += .015; p.x += Math.sin(p.ph)*.35;
      fxc.globalAlpha = .75; fxc.fillStyle = "#eef7ff"; fxc.beginPath(); fxc.arc(p.x, p.y, p.r, 0, 6.28); fxc.fill();
    } else {
      p.y += p.v; p.x -= p.v*.12;
      fxc.globalAlpha = .4; fxc.strokeStyle = "#9fd3ff"; fxc.lineWidth = 1; fxc.beginPath(); fxc.moveTo(p.x, p.y); fxc.lineTo(p.x + 1.6, p.y - 13); fxc.stroke();
    }
    if(p.y > fx.height + 10){ p.y = -10; p.x = Math.random()*(fx.width + 100); }
  }
}
fxLoop();

  if(poi?.hours) lines.push(`<div class="ln">${svg("Clock3",14)}<span>${esc(TH(poi.hours))}</span></div>`);
  if(floors >= 2 && b.h < 150 && !(poi && /памятник|монумент|смотров/.test(poi.category))) lines.push(`<div class="ln">${svg("Building2",14)}<span>${T("pcBld")(floors)}</span></div>`);

                 poi?.wiki ? `<a href="${esc(poi.wiki)}" target="_blank" rel="noopener">Wikipedia</a>` : ""].filter(Boolean);

// ---------- моё местоположение: определяется само при открытии и держится всегда ----------
const MEKEY = "okno_me";
var me = null, meAddr = "", meAddrAt = null, meWatch = null, firstFix = true;   // var: renderSaved() зовётся раньше этого места
try { const m = JSON.parse(localStorage.getItem(MEKEY) || "null"); if(m && m.lat){ me = {lat:m.lat, lon:m.lon}; meAddr = m.addr || ""; } } catch(e) {}
function renderMe(){
  const pt = $("#pt");
  if(me){ pt.innerHTML = `${svg("Navigation",15)}<b>${esc(meAddr || T("here"))}</b>`; pt.classList.add("on"); pt.title = T("here"); }
  else { pt.innerHTML = `${svg("LocateFixed",15)}<span>${T("here")}</span>`; pt.classList.remove("on"); }
}
function drawMe(){
  if(!me || !window._mapOk) return;
  if(!meMarker){ const el = document.createElement("div"); el.className = "mk me"; el.title = T("here");
    el.onclick = ev => { ev.stopPropagation(); openPin(me.lat, me.lon, {lat:me.lat, lng:me.lon}, true); };
    meMarker = new maplibregl.Marker({element:el}).setLngLat([me.lon, me.lat]).addTo(map); }
  else meMarker.setLngLat([me.lon, me.lat]);
}
// в браузере храним только округлённую точку (~150 м) и адрес — чтобы после перезагрузки всё было на месте сразу
function storeMe(){ try { localStorage.setItem(MEKEY, JSON.stringify({lat:+me.lat.toFixed(3), lon:+me.lon.toFixed(3), addr:meAddr})); } catch(e) {} }
async function whereAmI(){
  if(meAddr && meAddrAt && Math.hypot(me.lat-meAddrAt.lat, (me.lon-meAddrAt.lon)*0.63) < 0.0004) return;   // сдвинулся < ~40 м
  meAddrAt = {...me};
  try { const r = await (await fetch(`/api/where?lat=${me.lat.toFixed(4)}&lon=${me.lon.toFixed(4)}&lang=${LANG}`)).json();
    if(r.label){ meAddr = r.label; renderMe(); storeMe(); } } catch(e) {}
}
function watchMe(){
  if(!navigator.geolocation){ toast(T("noGeo")); return; }
  if(meWatch !== null) navigator.geolocation.clearWatch(meWatch);
  meWatch = navigator.geolocation.watchPosition(pos => {
    const {latitude:lat, longitude:lon} = pos.coords;
    if(Math.hypot(lat-51.13, (lon-71.43)*0.63) > 0.25){ if(firstFix) toast(T("notAst")); firstFix = false; return; }
    me = {lat, lon};
    drawMe(); renderMe(); storeMe(); whereAmI(); renderSaved(); renderNear();
    if(firstFix && !state.last) map.flyTo({center:[lon, lat], zoom:14.5, speed:1.4});
    firstFix = false;
  }, err => { if(err.code === 1) toast(T("geoDen")); }, {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
}
function goMe(){ if(me) map.flyTo({center:[me.lon, me.lat], zoom:Math.max(map.getZoom(), 15), speed:1.4}); watchMe(); }
$("#pt").onclick = goMe;
$("#locbtn").onclick = goMe;
renderMe(); watchMe();
let tiltHinted = false;
$("#tilt").onclick = () => {
  const on = map.getPitch() < 50;
  map.easeTo(on ? {pitch:60, bearing:-28, zoom:Math.max(map.getZoom(), 15), duration:1200} : {pitch:0, bearing:0, duration:900});
  if(on && !tiltHinted){ tiltHinted = true; toast(T("tilt")); }
};

fetch("/api/meta").then(r=>r.json()).then(m => {

  state.wx = () => `${f(w.temp)}, ${T("feels")} ${f(w.apparent)}`; wxLabel();

let pipeTimers = [];
function showSteps(){
  pipeTimers.forEach(clearTimeout); pipeTimers=[];
  const s = $("#sum"); s.className = "sum glass show";
  s.innerHTML = `<div class="steps">${T("steps").map(t=>`<div class="s"><i></i>${t}</div>`).join("")}</div>`;
  [0, 1600, 2200, 3800].forEach((t,i)=> pipeTimers.push(setTimeout(()=>{
    s.querySelectorAll(".s").forEach((el,j)=>{ el.className = "s" + (j<i?" done":j===i?" run":""); });
  }, t)));

// ---------- запрос ----------
async function run(extra={}){
  const text = $("#q").value.trim(); if(!text && !extra.parsed) return;
  const pnt = state.point || (me ? {lat:+me.lat.toFixed(3), lon:+me.lon.toFixed(3), mine:true} : null);
  const body = {text, point:pnt, now:state.nowOverride, weather:state.weather, saved:savedForServer(), ...extra};
  state.lastReq = body;
  $("#go").disabled = true; $("#ex").classList.remove("show"); $("#exBtn").classList.remove("on"); showSteps();
  $("#deck").style.opacity = .35;
  try{
    // бесплатный хостинг после простоя «просыпается» до минуты — ждём дольше и честно говорим, что происходит
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 75000);
    const slow = setTimeout(() => { const s = $("#sum .steps"); if(s && !s.querySelector(".wake")) s.insertAdjacentHTML("beforeend", `<div class="s wake"><i></i>${T("wake")}</div>`); }, 12000);
    const r = await (await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal:ctl.signal})).json();
    clearTimeout(timer); clearTimeout(slow);
    pipeTimers.forEach(clearTimeout);
    state.last = r;
    const rl = r.parsed?.language;
    if(rl && rl !== LANG && I18N[rl] && !extra.parsed){ LANG = rl; applyLang(); } else render(r);
  }catch(e){ pipeTimers.forEach(clearTimeout); $("#sum").innerHTML = `<div class="err">${T("down")}</div>`; }
  $("#go").disabled = false; $("#deck").style.opacity = 1;
}
function rerun(){ if(state.lastReq) run({parsed: state.last?.parsed, exclude: state.lastReq.exclude || [], keep: []}); }

function openLine(h){
  if(h.confidence==="verified") return `<div class="open ok">● ${esc(TH(h.text))}</div>`;
  if(h.confidence==="outdoor") return `<div class="open out">● ${esc(TH(h.text))}</div>`;

function track(r){
  const cold = r.weather?.simulated, segs = [];
  for(const st of r.steps){
    if(st.type==="leg") segs.push([st.mode==="walk"?"walk":"taxi", st.min]);
    if(st.type==="stop") segs.push(["stop", st.stay]);
  }
  segs.push(["buffer", Math.max(0, r.summary.buffer_min)]);
  return `<div class="track">${segs.map((g,i)=>`<div class="t-${g[0]} ${g[0]==="walk"&&cold?"cold":""}" style="flex:${Math.max(g[1],1)};animation-delay:${i*60}ms"></div>`).join("")}</div>
    <div class="ticks"><span>${r.now}</span><span>${r.deadline}</span></div>`;
}
function legText(l){
  if(!l) return "";
  if(l.mode==="walk") return `${svg("Footprints",13)} ${l.min} ${T("min")} ${T("walk")}${l.estimated?` <span class="est">${T("est")}</span>`:""}`;
  const jam = (l.traffic||"").startsWith("пробки 2GIS");
  return `${svg("CarTaxiFront",13)} ${T("taxi")} ~${l.drive_min + l.wait_min} ${T("min")} <span class="est ${jam?"jam":""}" title="${esc(l.traffic)}; подача ~${l.wait_min} мин">${jam?T("jam"):T("est")}</span>`;
}
// огромный запас (утром «к 20:00») — честно предлагаем сдвинуть маршрут ближе к сроку, а не гулять с 6 утра
const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h*60 + m; };
const hhmm = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function laterNote(r){
  const s = r.summary, now = toMin(r.now), dl = toMin(r.deadline);
  if(!s || s.buffer_min < 120 || r.destination?.label?.startsWith("обратно")) return "";
  const dur = (toMin(s.arrive) - now + 1440) % 1440;
  const start = Math.ceil((dl - dur - 20) / 10) * 10;
  if(start < now + 60) return "";
  const h = s.buffer_min >= 120 ? `${Math.floor(s.buffer_min/60)} ${LANG==="en"?"h":"ч"}` : `${s.buffer_min} ${T("min")}`;
  return `<div class="note">${esc(T("later")(h))}<button class="lb" data-t="${hhmm(start)}">${esc(T("laterB")(hhmm(start)))}</button></div>`;
}

const DM = d => { const [y, m, dd] = d.split("-"); return `${+dd}.${m}`; };
function evCards(list){

// план в календарь (.ics): каждая остановка — событие со временем и адресом-ссылкой; открывается на iPhone, в Google и Outlook
function downloadIcs(r){
  const day = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Almaty"}));
  const now = toMin(r.now);
  // время в UTC (Астана = UTC+5) — так любой календарь покажет правильно без описания часового пояса
  const stamp = hm => { const m = toMin(hm), plus = m < now - 120 ? 1 : 0;
    const t = new Date(Date.UTC(day.getFullYear(), day.getMonth(), day.getDate() + plus, Math.floor(m/60), m%60) - 5 * 3600e3);
    return t.toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z"; };
  const clean = t => String(t || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, " ");
  const ev = (a, b, title, desc, lat, lon) => ["BEGIN:VEVENT", `UID:${Math.random().toString(36).slice(2)}@okno`, `DTSTAMP:${stamp(r.now)}`,
    `DTSTART:${stamp(a)}`, `DTEND:${stamp(b)}`, `SUMMARY:${clean(title)}`, `DESCRIPTION:${clean(desc)}`,
    lat ? `GEO:${lat};${lon}` : "", lat ? `URL:https://2gis.kz/geo/${lon},${lat}` : "", "END:VEVENT"].filter(Boolean).join("\r\n");
  const stops = r.steps.filter(x => x.type === "stop");
  const body = stops.map(x => ev(x.arrive, x.leave, `Окно: ${DN(x)}`, `${x.why} ${x.todo}`, x.lat, x.lon));
  if(!r.destination.label.startsWith("обратно")) body.push(ev(r.summary.arrive, r.summary.arrive, `Окно: ${r.destination.label}`, r.headline, r.destination.lat, r.destination.lon));
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Okno Astana//RU", "CALSCALE:GREGORIAN", ...body, "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type: "text/calendar"})); a.download = "okno.ics"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(T("icsDone"));
}

function mk(inner, cls, lngLat, i){

let animId = 0;
async function drawRoute(r){
  await mapReady; clearRoute(); mapQuiet(true);
  const color = r.weather?.simulated ? "#a8d8ff" : "#4cc9f0";
  const legs = r.steps.filter(x=>x.type==="leg");
  const bounds = new maplibregl.LngLatBounds();
  legs.forEach(l=>l.coords.forEach(c=>bounds.extend(c)));
  bounds.extend([r.origin.lon, r.origin.lat]); bounds.extend([r.destination.lon, r.destination.lat]);
  mk("А","a",[r.origin.lon,r.origin.lat]);
  if(r.friend){   // путь друга до места встречи
    bounds.extend([r.friend.lon, r.friend.lat]);
    mk(svg("User",16), "f", [r.friend.lon, r.friend.lat]);
    map.getSource("route-friend")?.setData({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:r.friend.coords}});
  }
  if(!r.destination.label.startsWith("обратно")) mk("Б","b",[r.destination.lon,r.destination.lat]);
  r.steps.filter(x=>x.type==="stop").forEach((s,i)=>mk(`${ic(s.category,16)}<i>${i+1}</i>`,"",[s.lon,s.lat],i+1));
  map.fitBounds(bounds,{padding:PAD(), duration:900, maxZoom:15.5, pitch:45});
  const id = ++animId, walk = [], taxi = [];
  for(const l of legs){
    const target = l.mode==="walk" ? walk : taxi;
    const f = {type:"Feature", properties:{color}, geometry:{type:"LineString", coordinates:[]}};
    target.push(f);
    const N = l.coords.length, step = Math.max(1, Math.ceil(N/(36/legs.length)));
    for(let i=0;i<=N;i+=step){
      if(id!==animId) return;
      f.geometry.coordinates = l.coords.slice(0, Math.min(N, i+1));
      map.getSource("route-walk").setData({type:"FeatureCollection",features:walk});
      map.getSource("route-taxi").setData({type:"FeatureCollection",features:taxi});
      await new Promise(res=>setTimeout(res,16));
    }
    f.geometry.coordinates = l.coords;
  }
  map.getSource("route-walk").setData({type:"FeatureCollection",features:walk});
  map.getSource("route-taxi").setData({type:"FeatureCollection",features:taxi});
}

      const st = navigator.permissions ? (await navigator.permissions.query({name:"geolocation"})).state : "prompt";
      if(st !== "denied") for(let i = 0; i < 50 && !me; i++) await new Promise(r => setTimeout(r, 100));   // до 5 с
    } catch(e) {}
    run();
  })();
})();
</script>
