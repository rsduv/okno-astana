<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Окно</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234cc9f0%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 font-family=%22Arial%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%2308111a%22%3EО%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#090d12; --glass:rgba(14,19,26,.86); --glass2:rgba(20,27,36,.92);
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eef3f8; --muted:#97a3b2; --dim:#627083;
  --accent:#4cc9f0; --accent2:#8b6cff; --ok:#3ddc97; --warn:#f6b73c; --cold:#a8d8ff; --taxi:#c7cfd9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.5)}

/* ---------- верх: поиск ---------- */
.top{position:fixed;left:16px;top:16px;width:min(540px,calc(100vw - 32px));z-index:6;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:10px;border-radius:18px;padding:6px 6px 6px 8px}
.logo{flex:none;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#08111a}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:15.5px;padding:9px 0}
.search input::placeholder{color:var(--dim)}
.go{flex:none;height:40px;padding:0 16px;border-radius:13px;border:0;background:var(--accent);color:#08111a;font-weight:800;font-size:14px;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.pill:hover{color:var(--text)}
.pill.on{color:var(--text);background:rgba(40,52,66,.92)}
.pill.cold.on{color:var(--cold);background:rgba(40,70,100,.9)}
.pill input{background:none;border:0;color:inherit;font:inherit;width:0;outline:none;color-scheme:dark;padding:0}
.pill .x{opacity:.6;margin-left:2px}
.langs{position:fixed;right:64px;top:16px;z-index:6;display:flex;padding:3px;gap:2px;border-radius:999px}
.langs button{background:none;border:0;color:var(--muted);font-weight:800;font-size:11.5px;padding:4px 7px;border-radius:999px;cursor:pointer}
.langs button.on{background:rgba(76,201,240,.18);color:var(--accent)}
.pill svg{width:15px;height:15px;flex:none}
#locbtn svg{width:20px;height:20px}
.ico{color:#c9bcff}.mk{color:#c9bcff}
.card .leg svg{flex:none}
.ex button{display:flex;gap:10px;align-items:flex-start}
.ex .qi{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(76,201,240,.12);color:var(--accent)}

/* сводка под поиском */
.sum{border-radius:18px;padding:12px 14px;display:none;animation:pop .35s ease both}
.sum.show{display:block}
.sum .l1{display:flex;align-items:baseline;gap:9px}
.sum .l1 b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum .l1 span{color:var(--muted);font-size:13px}
.sum .l1 .buf{margin-left:auto;font-weight:800;color:var(--ok)}.sum .l1 .buf.warn{color:var(--warn)}
.sum .hl{font-size:14px;font-weight:600;color:#d5dce5;margin:3px 0 9px;line-height:1.35}
.track{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}
.track div{transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.t-walk{background:var(--accent)}.t-walk.cold{background:var(--cold)}
.t-taxi{background:#7e8794}.t-stop{background:var(--accent2)}
.t-buffer{background:repeating-linear-gradient(135deg,rgba(61,220,151,.5) 0 4px,rgba(61,220,151,.18) 4px 8px)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.note{margin-top:9px;font-size:12.5px;line-height:1.4;color:#dcd6ff;display:flex;gap:7px}
.note:before{content:"!";flex:none;width:17px;height:17px;border-radius:50%;background:rgba(139,108,255,.3);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.links a,.links button{font-size:12.5px;font-weight:700;text-decoration:none;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);cursor:pointer}
.links .primary{background:var(--accent);color:#08111a;border-color:var(--accent)}
.links .ghost{background:none;border-color:transparent;color:var(--muted);margin-left:auto}
.err{font-size:14px;line-height:1.5}
.err .tip{color:var(--muted);font-size:13px;margin-top:6px}
.steps{display:flex;flex-direction:column;gap:4px}
.steps .s{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--dim)}
.steps .s i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);flex:none}
.steps .s.run{color:var(--text)}.steps .s.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps .s.done{color:var(--muted)}.steps .s.done i{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- низ: карточки ---------- */
.deck{position:fixed;left:0;right:0;bottom:16px;z-index:5;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{flex:none;width:300px;scroll-snap-align:start;border-radius:20px;padding:13px 14px;cursor:pointer;animation:pop .45s ease both;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--accent2)}
.card .leg{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.card .leg .est.jam{color:#ffb86b;background:rgba(255,160,80,.12)}
.card .leg .est{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--card);color:var(--dim)}
.ch{display:flex;gap:10px;align-items:center}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:rgba(139,108,255,.16);position:relative}
.ico i{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10.5px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid #121821}
.ch h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch .sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.swap{margin-left:auto;flex:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--muted);cursor:pointer;font-size:15px}
.swap:hover{color:var(--text)}
.why{font-size:13.5px;line-height:1.42;margin-top:9px;color:#e3e8ee}
.todo{font-size:12.8px;line-height:1.42;margin-top:5px;color:var(--muted)}
.open{font-size:12px;font-weight:700;margin-top:auto;padding-top:9px}
.open.ok{color:var(--ok)}.open.est{color:var(--warn)}.open.out{color:var(--cold)}
.rt{color:#ffd166;font-weight:700}
.src{font-size:10.5px;color:var(--dim);margin-top:4px}.src a{color:var(--dim)}
.card.fin{width:236px;justify-content:center}
.card .leg{white-space:nowrap}
.card.fin .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

/* старт: примеры */
.ex{position:fixed;left:16px;bottom:16px;z-index:5;width:min(540px,calc(100vw - 32px));border-radius:20px;padding:14px}
.ex h4{margin:0 0 4px;font-size:15px}
.ex p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.45}
.ex .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ex button{text-align:left;font-size:13px;padding:10px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;line-height:1.3}
.ex button:hover{border-color:var(--line2)}
.ex button small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}

/* «как посчитано» */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.sheet.show{display:flex}
.sheet .box{width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:22px;padding:18px 20px;background:var(--glass2)}
.sheet h4{margin:0 0 10px;font-size:17px}
.sheet ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.55}
.sheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.sheet .kv div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--muted)}
.sheet .kv b{display:block;color:var(--text);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chips span{font-size:11.5px;padding:4px 8px;border-radius:8px;background:var(--card);color:var(--muted)}
.chips b{color:var(--text)}

/* карта */
.mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#1b2330;border:2.5px solid var(--accent2);box-shadow:0 6px 18px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s;position:relative}
.mk:hover,.mk.sel{transform:scale(1.18)}
.mk i{position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center}
.mk.a{background:#fff;border-color:#fff;color:#08111a;font-weight:800;font-size:13px;width:28px;height:28px}
.mk.b{background:var(--ok);border-color:var(--ok);color:#08111a;font-weight:800;font-size:13px;width:28px;height:28px}
.mk.me{width:18px;height:18px;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 8px rgba(76,201,240,.22)}
.maplibregl-ctrl-attrib{background:rgba(9,13,18,.65)!important;color:var(--dim)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--dim)!important}
.maplibregl-ctrl-top-right{top:8px;right:8px}
.maplibregl-ctrl-group{background:var(--glass)!important;border:1px solid var(--line)!important}
.maplibregl-ctrl-group button span{filter:invert(1)}
#locbtn{position:fixed;right:16px;top:96px;z-index:4;width:40px;height:40px;border-radius:12px;color:var(--accent);display:grid;place-items:center;cursor:pointer}
#tilt{position:fixed;right:16px;top:144px;z-index:4;width:40px;height:40px;border-radius:12px;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
#tilt.on{color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#locbtn.busy svg{animation:spin 1s linear infinite}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-20px);z-index:30;max-width:min(440px,90vw);padding:11px 16px;border-radius:14px;background:var(--glass2);border:1px solid var(--line2);font-size:13.5px;line-height:1.4;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .top{left:8px;top:8px;width:calc(100vw - 16px);gap:6px}
  .search{border-radius:16px;padding:5px 5px 5px 7px}
  .search input{font-size:16px;padding:7px 0}
  .logo{width:30px;height:30px;border-radius:9px}
  .go{height:36px;padding:0 13px}
  .pill{padding:6px 10px;font-size:12px}
  .sum{padding:10px 12px;border-radius:16px}
  .sum .l1 b{font-size:22px}
  .sum .hl{font-size:13px;margin:2px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note{font-size:12px;margin-top:6px}
  .links{margin-top:8px}
  .links a,.links button{padding:6px 10px;font-size:12px}
  .sum.mini .hl,.sum.mini .track,.sum.mini .ticks,.sum.mini .note,.sum.mini .links{display:none}
  .sum .l1{cursor:pointer}
  .deck{bottom:8px;padding:4px 8px 4px;gap:8px}
  .card{width:80vw;padding:11px 12px;border-radius:18px}
  .card .why{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .todo{font-size:12.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .src{display:none}
  .ico{width:36px;height:36px;border-radius:11px}
  .card.fin{width:46vw}
  .ex{left:8px;bottom:8px;width:calc(100vw - 16px);padding:12px}
  .ex .grid{grid-template-columns:1fr}
  .ex button{padding:8px 10px}
  #locbtn,#tilt{display:none}
  .langs{right:8px;top:auto;bottom:auto;top:108px;padding:2px}
  body.res .langs{display:none}
  .maplibregl-ctrl-top-right{display:none}
  .sheet{padding:8px;align-items:flex-end}
  .sheet .box{max-height:80vh;border-radius:20px 20px 16px 16px}
  .sheet .kv{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>
<button id="locbtn" class="glass" title="Где я? Навести карту на меня"><i data-lucide="locate-fixed"></i></button>
<button id="tilt" class="glass" title="3D-вид: наклонить и повернуть карту">3D</button>
<div id="toast"></div>
<div class="glass langs" id="langs"><button data-l="ru">RU</button><button data-l="kk">KZ</button><button data-l="en">EN</button></div>

<div class="top">
  <div class="search glass">
    <div class="logo">О</div>
    <input id="q" autocomplete="off" placeholder="Где ты, куда нужно и к скольки?">
    <button class="go" id="go">Найти</button>
  </div>
  <div class="row">
    <button class="pill glass" id="pt"><i data-lucide="locate-fixed"></i><span>я здесь</span></button>
    <label class="pill glass" id="tpill" title="время старта (для демо)"><i data-lucide="clock-3"></i><input type="time" id="now"><span id="tnow">сейчас</span></label>
    <button class="pill glass on" id="wnow"><i data-lucide="cloud-sun"></i><span id="wxl">погода</span></button>
    <button class="pill glass cold" id="wcold"><i data-lucide="snowflake"></i>−25°</button>
    <span id="savedChips" style="display:contents"></span>
  </div>
  <div class="sum glass" id="sum"></div>
</div>

<div class="ex glass" id="ex">
  <h4 id="exT"></h4>
  <p id="exP"></p>
  <div class="grid" id="quick"></div>
</div>
<div class="deck" id="deck"></div>

<div class="sheet" id="sheet"><div class="box glass" id="sheetBox"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {point:null, weather:"now", nowOverride:null, last:null, lastReq:null};

const svg = (name, size=18) => { try { const el = lucide.createElement(lucide.icons[name]);
  el.setAttribute("width", size); el.setAttribute("height", size); return el.outerHTML; } catch(e){ return ""; } };
const ICON = {"кафе":"Coffee","ресторан":"Utensils","фастфуд":"Sandwich","бар":"Wine","ночной клуб":"Disc3","торговый центр":"ShoppingBag",
  "кино":"Clapperboard","театр":"Drama","музей":"Landmark","галерея":"Image","арт-центр":"Palette","библиотека":"Library","книжный":"BookOpen",
  "коворкинг":"Laptop","памятник":"TowerControl","достопримечательность":"Sparkles","фонтан":"Droplets","смотровая":"Binoculars","парк":"Trees",
  "сад":"Flower2","детская площадка":"ToyBrick","мечеть":"MoonStar","собор":"Church","каток":"Snowflake","боулинг":"CircleDot","квест":"KeyRound",
  "развлечения":"PartyPopper","океанариум":"Fish","зоопарк":"Rabbit","парк развлечений":"FerrisWheel","батутный парк":"Baby","аквапарк":"Waves"};
const ic = (c, size=20) => svg(ICON[c] || "MapPin", size);


// ---------- языки интерфейса: русский / English / қазақша ----------
const I18N = {
 ru:{find:"Найти", ph:"Где ты, куда нужно и к скольки?", here:"я здесь", now:"сейчас", feels:"ощущается", heroT:"Есть свободное время? Заполним его.",
  heroP:"Скажи, где ты, куда тебе нужно и к скольки. «Окно» найдёт 1–3 места по пути — открытых, когда ты дойдёшь, и так, чтобы ты точно успел.",
  arrive:"на месте", back:"обратно", buf:"запас", min:"мин", open2gis:"Открыть в 2GIS", how:"Как посчитано?", walk:"пешком", taxi:"такси", est:"оценка", jam:"пробки 2GIS",
  save:"сохранить точку", saveTo:"Дом, Тётя Гуля…", savedT:n=>`Сохранил «${n}». Теперь можно написать «к ${n} к 19:00».`, addTime:"Допиши время — например «к 19:00» — или «есть час».",
  gotoQ:n=>`Мне нужно в «${n}» к `, mark:"Отметил старт на карте. Теперь напиши, куда и к скольки — или «есть час».", noGeo:"Браузер не умеет определять место — ткни в карту.",
  notAst:"Похоже, ты не в Астане. Ткни в карту, где будешь, — или напиши ориентир.", geoDen:"Не дали доступ к геолокации. Можно ткнуть в карту или написать «я у Байтерека».",

  steps:["Понимаю запрос","Ищу места по пути","Проверяю время, часы работы, погоду","Пишу, почему туда стоит идти"], down:"Сервер не ответил. Проверь, что он запущен.",
  howT:"Как «Окно» поняло запрос", from:"откуда", to:"куда", loop:"потом обратно", win:"окно", lang:"язык", out:"на улице", maxOut:"макс. подряд", km:"км", walkKm:"пешком",
  cands:"мест рассмотрено", plans:"вариантов маршрута", tUnd:"понял / посчитал", dataT:"Данные и оговорки", copy:"Скопировать план", copied:"Скопировано ✓", close:"Закрыть",
  tryT:"Попробуй, например:", txtAi:"текст: ИИ по фактам", txtTpl:"текст: шаблон", replace:"заменить это место",

// ---------- снег/дождь на фоне — по реальной погоде (или в симуляции −25°) ----------
const fx = $("#fx"), fxc = fx.getContext("2d");
let fxKind = null, parts = [];
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function setFx(kind){ fxKind = calm ? null : kind; parts = []; }
function fxLoop(){
  requestAnimationFrame(fxLoop);
  if(fx.width !== innerWidth || fx.height !== innerHeight){ fx.width = innerWidth; fx.height = innerHeight; }
  fxc.clearRect(0, 0, fx.width, fx.height);
  if(!fxKind) return;
  const N = fxKind==="snow" ? 130 : 150;
  while(parts.length < N) parts.push({x:Math.random()*fx.width, y:Math.random()*fx.height - (parts.length>=N/2?fx.height:0),
    r:1.2+Math.random()*2.2, v:fxKind==="snow" ? .4+Math.random()*.9 : 8+Math.random()*5, ph:Math.random()*6.28});
  for(const p of parts){
    if(fxKind==="snow"){
      p.y += p.v; p.ph += .015; p.x += Math.sin(p.ph)*.35;
      fxc.globalAlpha = .75; fxc.fillStyle = "#eef7ff"; fxc.beginPath(); fxc.arc(p.x, p.y, p.r, 0, 6.28); fxc.fill();
    } else {
      p.y += p.v; p.x -= p.v*.12;
      fxc.globalAlpha = .4; fxc.strokeStyle = "#9fd3ff"; fxc.lineWidth = 1; fxc.beginPath(); fxc.moveTo(p.x, p.y); fxc.lineTo(p.x + 1.6, p.y - 13); fxc.stroke();
    }
    if(p.y > fx.height + 10){ p.y = -10; p.x = Math.random()*(fx.width + 100); }
  }
}
fxLoop();

async function run(extra={}){
  const text = $("#q").value.trim(); if(!text && !extra.parsed) return;
  const body = {text, point:state.point, now:state.nowOverride, weather:state.weather, saved, ...extra};
  state.lastReq = body;
  $("#go").disabled = true; $("#ex").style.display = "none"; showSteps();
  $("#deck").style.opacity = .35;
  try{
    const r = await (await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})).json();
    pipeTimers.forEach(clearTimeout);
    state.last = r;
    const rl = r.parsed?.language;
    if(rl && rl !== LANG && I18N[rl] && !extra.parsed){ LANG = rl; applyLang(); } else render(r);
  }catch(e){ pipeTimers.forEach(clearTimeout); $("#sum").innerHTML = `<div class="err">${T("down")}</div>`; }
  $("#go").disabled = false; $("#deck").style.opacity = 1;
}
function rerun(){ if(state.lastReq) run({parsed: state.last?.parsed, exclude: state.lastReq.exclude || [], keep: []}); }

// ---------- отрисовка ----------
const PREF_RU = {coffee:"кофе", food:"поесть", sights:"посмотреть город", nature:"природа", culture:"культура", shopping:"шопинг",
  kids:"с ребёнком", night:"ночь", work:"поработать", active:"активно", cinema:"кино", walk:"прогуляться"};
const KEY = /Ощущается|Вылет|Поезд|не назвал|без такси|не нашёл|Воздух|лучше прийти/;
function openLine(h){
  if(h.confidence==="verified") return `<div class="open ok">● ${esc(TH(h.text))}</div>`;
  if(h.confidence==="outdoor") return `<div class="open out">● ${esc(TH(h.text))}</div>`;
  return `<div class="open est" title="в данных нет часов работы — показаны типичные">◐ ${esc(TH(h.text))}</div>`;
}
function track(r){
  const cold = r.weather?.simulated, segs = [];
  for(const st of r.steps){
    if(st.type==="leg") segs.push([st.mode==="walk"?"walk":"taxi", st.min]);
    if(st.type==="stop") segs.push(["stop", st.stay]);
  }
  segs.push(["buffer", Math.max(0, r.summary.buffer_min)]);
  return `<div class="track">${segs.map((g,i)=>`<div class="t-${g[0]} ${g[0]==="walk"&&cold?"cold":""}" style="flex:${Math.max(g[1],1)};animation-delay:${i*60}ms"></div>`).join("")}</div>
    <div class="ticks"><span>${r.now}</span><span>${r.deadline}</span></div>`;
}
function legText(l){
  if(!l) return "";
  if(l.mode==="walk") return `${svg("Footprints",13)} ${l.min} ${T("min")} ${T("walk")}${l.estimated?` <span class="est">${T("est")}</span>`:""}`;
  const jam = (l.traffic||"").startsWith("пробки 2GIS");
  return `${svg("CarTaxiFront",13)} ${T("taxi")} ~${l.drive_min + l.wait_min} ${T("min")} <span class="est ${jam?"jam":""}" title="${esc(l.traffic)}; подача ~${l.wait_min} мин">${jam?T("jam"):T("est")}</span>`;
}
function render(r){
  const sum = $("#sum"), deck = $("#deck");
  sum.className = "sum glass show";
  if(r.error){
    const tips = (r.notes||[]).map(n=>`<div class="tip">${esc(n)}</div>`).join("");
    sum.innerHTML = `<div class="err">${esc(r.error)}${tips}<div class="tip" style="margin-top:10px">${T("tryT")}</div>
      <div class="links">${[0,2,3].map(i=>`<button class="tryq" data-i="${i}">${esc(T("quick")[i][0])}</button>`).join("")}</div></div>`;
    sum.querySelectorAll(".tryq").forEach(b => b.onclick = () => { $("#q").value = T("quick")[b.dataset.i][2]; setTime(QUICK[b.dataset.i][4]); clearPoint(); run(); });
    deck.innerHTML = ""; clearRoute(); return;
  }
  const s = r.summary, notes = r.notes||[], isKey = (x,i) => r.notes_key ? r.notes_key[i] : KEY.test(x);
  const key = notes.filter(isKey);
  const back = r.destination.label.startsWith("обратно");
  sum.innerHTML = `
    <div class="l1"><b>${s.arrive}</b><span>${back?T("back"):T("arrive")}</span><span class="buf ${s.buffer_min<8?"warn":""}">${T("buf")} ${s.buffer_min} ${T("min")}</span></div>
    <div class="hl">${esc(r.headline)}</div>
    ${track(r)}
    ${key.map(x=>`<div class="note">${esc(x)}</div>`).join("")}
    <div class="links">
      <a class="primary" href="${dgis(r)}" target="_blank" rel="noopener">${T("open2gis")}</a>
      <a href="${gmaps(r)}" target="_blank" rel="noopener">Google Maps</a>
      <button class="ghost" id="how">${T("how")}</button>
    </div>`;
  // карточки: у каждой остановки сверху — как до неё добраться
  const stops = r.steps.filter(x=>x.type==="stop");
  let lastLeg = null, n = 0, html = "";
  for(const st of r.steps){
    if(st.type==="leg"){ lastLeg = st; continue; }
    if(st.type==="stop"){
      n++;
      const others = stops.filter(x=>x.id!==st.id).map(x=>x.id);
      const inside = st.facts && st.facts["внутри"] ? ` · ${esc(st.facts["внутри"])}` : "";
      html += `<div class="card glass" data-i="${n}" data-lat="${st.lat}" data-lon="${st.lon}" style="animation-delay:${n*80}ms">
        <div class="leg">${legText(lastLeg)}</div>
        <div class="ch"><div class="ico">${ic(st.category)}<i>${n}</i></div>
          <div style="min-width:0"><h3>${esc(st.name)}</h3><div class="sub">${st.arrive}–${st.leave} · ${st.stay} ${T("min")}${TH(inside)}${st.rating?` · <span class="rt">★ ${String(st.rating).replace(".",",")}</span>`:""}</div></div>
          <button class="swap" title="${T("replace")}" data-ex="${esc(st.id)}" data-keep="${esc(others.join("|"))}">${svg("RefreshCw",15)}</button></div>
        <div class="why">${esc(st.why)}</div>
        <div class="todo">${esc(st.todo)}</div>
        ${openLine(st.hours)}
        <div class="src"><a href="${esc(st.source)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${/2gis/.test(st.source)?"2GIS":/wiki/.test(st.source)?"Wikipedia":"OpenStreetMap"}</a>${st.dgis_id && !/2gis/.test(st.source)?` · <a href="https://2gis.kz/astana/firm/${esc(String(st.dgis_id).split("_")[0])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">2GIS</a>`:""} · ${st.text_source==="ai"?T("txtAi"):T("txtTpl")}</div>
      </div>`;
    }
    if(st.type==="end"){
      html += `<div class="card glass fin" data-lat="${r.destination.lat}" data-lon="${r.destination.lon}" style="animation-delay:${(n+1)*80}ms">
        <div class="leg">${legText(lastLeg)}</div>
        <div class="ch"><div class="ico" style="background:rgba(61,220,151,.18)">${svg(back?"Undo2":"Flag",20)}</div>
          <div style="min-width:0"><h3>${esc(r.destination.label.replace("обратно: ",""))}</h3><div class="sub">${T("buf")} ${s.buffer_min} ${T("min")}</div></div></div>
        <div class="big" style="margin-top:10px">${st.time}</div></div>`;
    }
  }
  deck.innerHTML = html; deck.scrollLeft = 0;
  document.body.classList.add("res");
  sum.querySelector(".l1").onclick = () => { if(mobile()) sum.classList.toggle("mini"); };
  deck.querySelectorAll(".swap").forEach(b => b.onclick = e => { e.stopPropagation();
    run({parsed:r.parsed, exclude:[...(state.lastReq.exclude||[]), b.dataset.ex], keep:b.dataset.keep?b.dataset.keep.split("|"):[]}); });
  deck.querySelectorAll(".card").forEach(c => c.onclick = () => focusCard(c));
  $("#how").onclick = () => showHow(r);
  drawRoute(r);
}
function focusCard(c){
  $("#deck").querySelectorAll(".card").forEach(x=>x.classList.toggle("sel", x===c));
  markers.forEach(m=>m.getElement().firstElementChild?.classList.toggle("sel", !!m._i && m._i==c.dataset.i));
  map.flyTo({center:[+c.dataset.lon,+c.dataset.lat], zoom:16.3, pitch:58, bearing:-20, speed:1.2, padding:PAD()});
}
function showHow(r){
  const p = r.parsed||{}, s = r.summary, ch = [];
  ch.push(`${T("from")}: <b>${esc(r.origin.label)}</b>`);
  ch.push(r.destination.label.startsWith("обратно") ? T("loop") : `${T("to")}: <b>${esc(r.destination.label)}</b>`);
  ch.push(`${T("win")}: <b>${r.now}–${r.deadline}</b>`);
  (p.prefs||[]).forEach(x=>ch.push(PREF_RU[x]||x));
  if(p.language && p.language!=="ru") ch.push(`${T("lang")}: ${p.language.toUpperCase()}`);
  const c = r.considered||{}, tm = r.timings||{}, sec = k => tm[k] ? (tm[k]/1000).toFixed(1)+" с" : "—";
  $("#sheetBox").innerHTML = `<h4>${T("howT")}</h4>
    <div class="chips">${ch.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="kv"><div><b>${s.outdoor_min} ${T("min")}</b>${T("out")}</div><div><b>${s.max_outdoor_leg} ${T("min")}</b>${T("maxOut")}</div><div><b>${String(s.walk_km).replace(".",",")} ${T("km")}</b>${T("walkKm")}</div></div>
    <div class="kv"><div><b>${c.candidates??"—"}</b>${T("cands")}</div><div><b>${c.plans??"—"}</b>${T("plans")}</div><div><b>${sec("understand")} / ${sec("plan")}</b>${T("tUnd")}</div></div>
    <h4>${T("dataT")}</h4>
    <ul>${(r.notes||[]).filter((x,i)=>!(r.notes_key ? r.notes_key[i] : KEY.test(x))).concat(r.data_used||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <div class="links"><button id="share">${T("copy")}</button><button class="ghost" id="closeHow">${T("close")}</button></div>`;
  $("#share").onclick = () => { navigator.clipboard?.writeText(planText(r)); $("#share").textContent = T("copied"); };
  $("#closeHow").onclick = () => $("#sheet").classList.remove("show");
  $("#sheet").classList.add("show");
}
function pts(r){ return [r.origin, ...r.steps.filter(x=>x.type==="stop"), r.destination]; }
function gmaps(r){ const P = pts(r); const ll = p=>`${p.lat},${p.lon}`;
  return `https://www.google.com/maps/dir/?api=1&origin=${ll(P[0])}&destination=${ll(P[P.length-1])}&waypoints=${P.slice(1,-1).map(ll).join("|")}&travelmode=walking`; }
function dgis(r){ return `https://2gis.kz/astana/directions/points/${pts(r).map(p=>`${p.lon}%2C${p.lat}`).join("%7C")}`; }
function planText(r){
  return [`Окно: ${r.headline}`, ...r.steps.filter(x=>x.type==="stop").map((x,i)=>`${i+1}. ${x.arrive} ${x.name} — ${x.todo}`),
    `На месте в ${r.summary.arrive}, запас ${r.summary.buffer_min} мин.`].join("\n");
}

// ---------- маршрут на карте ----------
function clearRoute(){ markers.forEach(m=>m.remove()); markers=[];
  ["route-walk","route-taxi"].forEach(id=>map.getSource(id)?.setData({type:"FeatureCollection",features:[]})); }
function mk(inner, cls, lngLat, i){
  const el = document.createElement("div");
  el.innerHTML = `<div class="mk ${cls||""}">${inner}</div>`;
  const m = new maplibregl.Marker({element:el}).setLngLat(lngLat).addTo(map); m._i = i; markers.push(m);
  if(i) el.onclick = ev => { ev.stopPropagation(); const c = $(`#deck .card[data-i="${i}"]`);
    if(c){ c.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"}); focusCard(c); } };
  return m;
}
let animId = 0;
async function drawRoute(r){
  await mapReady; clearRoute();
  const color = r.weather?.simulated ? "#a8d8ff" : "#4cc9f0";
  const legs = r.steps.filter(x=>x.type==="leg");
  const bounds = new maplibregl.LngLatBounds();
  legs.forEach(l=>l.coords.forEach(c=>bounds.extend(c)));
  bounds.extend([r.origin.lon, r.origin.lat]); bounds.extend([r.destination.lon, r.destination.lat]);
  mk("А","a",[r.origin.lon,r.origin.lat]);
  if(!r.destination.label.startsWith("обратно")) mk("Б","b",[r.destination.lon,r.destination.lat]);
  r.steps.filter(x=>x.type==="stop").forEach((s,i)=>mk(`${ic(s.category,16)}<i>${i+1}</i>`,"",[s.lon,s.lat],i+1));
  map.fitBounds(bounds,{padding:PAD(), duration:900, maxZoom:15.5, pitch:45});
  const id = ++animId, walk = [], taxi = [];
  for(const l of legs){
    const target = l.mode==="walk" ? walk : taxi;
    const f = {type:"Feature", properties:{color}, geometry:{type:"LineString", coordinates:[]}};
    target.push(f);
    const N = l.coords.length, step = Math.max(1, Math.ceil(N/(36/legs.length)));
    for(let i=0;i<=N;i+=step){
      if(id!==animId) return;
      f.geometry.coordinates = l.coords.slice(0, Math.min(N, i+1));
      map.getSource("route-walk").setData({type:"FeatureCollection",features:walk});
      map.getSource("route-taxi").setData({type:"FeatureCollection",features:taxi});
      await new Promise(res=>setTimeout(res,16));
    }
    f.geometry.coordinates = l.coords;
  }
  map.getSource("route-walk").setData({type:"FeatureCollection",features:walk});
  map.getSource("route-taxi").setData({type:"FeatureCollection",features:taxi});
}

document.querySelectorAll("#langs button").forEach(b => b.onclick = e => { e.stopPropagation(); setLang(b.dataset.l); });
applyLang();

// ---------- ссылка на сценарий: ?q=...&t=17:20&w=cold ----------
(() => {
  const u = new URLSearchParams(location.search);
  if(!u.get("q")) return;
  $("#q").value = u.get("q");
  if(u.get("t")) setTime(u.get("t"));
  if(u.get("w")==="cold") setWeather("cold");
  run();
})();
</script>
</body>
