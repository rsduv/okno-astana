# Автоматический сбор мест Астаны из OpenStreetMap.
# Раз в неделю (и по кнопке) заново запускает scripts/collect_osm.py
# и scripts/collect_wiki.py, сохраняет data/poi.json и data/wiki.json, если что-то изменилось.
name: Обновление базы мест (OSM)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать места из Overpass API
        run: python scripts/collect_osm.py
      - name: Известные места и описания из Wikidata / Википедии
        run: |
          pip install httpx
          python scripts/collect_wiki.py
      - name: Районы и станции LRT, открытый датасет мест
        run: |
          python scripts/collect_city.py
          python scripts/build_dataset.py
      - name: Сохранить, если база изменилась
        run: |
          git config user.name "poi-bot"
          git config user.email "poi-bot@users.noreply.github.com"
          git add data/poi.json data/wiki.json data/images.json data/districts.json data/lrt.json data/dataset docs/dataset.md
          git diff --cached --quiet || git commit -m "data: обновление мест из OSM $(date -u +%F)"
          git push
