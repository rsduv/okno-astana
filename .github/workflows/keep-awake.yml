# Бесплатный хостинг Render «засыпает» через 15 минут без посетителей, и первое открытие ждёт ~30–50 секунд.
# Пока жюри смотрит проекты, раз в 10 минут заглядываем на сайт, чтобы он не спал.
name: Не давать сайту уснуть

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Открыть сайт
        run: curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 120 https://okno-astana.onrender.com/api/meta || true
